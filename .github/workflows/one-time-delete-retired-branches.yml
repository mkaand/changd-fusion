# Temporary, one-time cleanup of explicitly inventoried retired branches.
# Never keep this workflow installed after it completes.
name: One-time retired branch cleanup
on:
  push:
    branches: [master]
    paths: ['.github/workflows/one-time-delete-retired-branches.yml']
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Confirm production architecture is the sole default
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = master
          test "$(docker compose config --services)" = fusion
          test -f simple/server.mjs
          test ! -e updater/Dockerfile
          test ! -e server/src/worker-main.ts
      - name: Delete only 31 exact unprotected retired refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/retired-branches.txt <<'BRANCHES'
          experiment/playwright-webkit-visual-engine 22fda0aef05e6bac5855f44ee7d04b63ca13354c
          experiment/servo-fetch-visual-engine 03d30dea8677b803cf74c88bb4cddd5d0ba7d4d8
          experiment/wpe-webkit-benchmark 3b44e45e61a115756d652c2ffbd9933c4c13f34f
          feat/changd-fusion-sprint-1 9ba0b7847fbf0674712eb9e4aca22606da44c412
          feature/configurable-updater-ui-port 309f75c6b1434cd55b25b433ff1cc27af9bb057b
          feature/containerized-ghcr-updater 5e993920d3c76722eff1bbd9ee6c2dc102733c8e
          feature/ghcr-immutable-image-release 2e4191d9cf11d3d15e97d8c847afdd4074d4f4da
          feature/interactive-preview-capacity 1826f79b3b3f6176810e96edef91225cfc819b9c
          feature/p0-preview-priority-autodeploy 1d82f8dc3988abe9a867c2a0624833c053c4d2a3
          feature/simple-single-container-sqlite 66cce647a6c2d4c3e857c8c88c78aac93471cde0
          feature/v032-preview-cookie-cpu 84a0b547db23d8baf47338fae3a5a21d2ecff0ca
          feature/v033-secure-updater 530d9eb98ebc514b5b6bff415256a9adff860bf2
          fix/adoption-safe-stage-errors 3083efc15db49e14070a53271fbd12e818c6f7c6
          fix/attestation-slsa-builder-identity 639d991be6ee2682770e63c06bca1f494a98e6f0
          fix/await-maintenance-cli-before-pool-close 6c2a2bf0d3b48a97c7a20b1d4d7a213119e6486d
          fix/browser-steps-reliability-ui c470559033ccb9ac4e9d831ba79fef6730493e8e
          fix/ghcr-blob-manual-redirect e2aef157d0ba4e3bc7f68dd0a6d1d8179e636517
          fix/ghcr-oci-bearer-challenge c70f42050b92cc4f7ce2742bdf5fac835e0eb03a
          fix/ghcr-release-yaml-indent eb7502baf2d9c6e99017f6558a1ee7efc5661e47
          fix/ghcr-ui-oci-source 32ca667f7ef33024fc27f532d87355c5a3276e7a
          fix/github-compare-ancestry-contract 1035ecbb95356fcdf65ca2c3e49592fe15b89c5f
          fix/historical-publisher-bound-ci 79689e5a77a1c6a4f94eb5ea0b2ccc3776705b4a
          fix/operator-adopt-verified-installed-release 6e1872139bc06600df3914d4e9a1a4cbdc22d067
          fix/select-current-trusted-release-only b0c09447ccd194a1eb175fe6b8610ff54a1d871b
          fix/updater-docker-config-uid10001 36ebccf85fb4ff0aeb9d9eb9bc33840dd829496e
          fix/updater-dry-run-exit-status 812041e85ad4c60422fd950326fb3728ba019415
          fix/updater-private-compose-mounts bdbecf32b9ab92e0206d2099a33ff998d49bef1d
          fix/updater-seccomp-profile-trust 22dae57d7a9e4965802b716fbc57d9c609889438
          fix/v0-3-1-preview-consent-mobile fa1b0790f26e9b6a9c4eabdc25ee2eadff420130
          perf/c01-c02-comparison-fast-paths 2358f0a9d9a6ed151a777c3d3f40db0da6119726
          simplify_frequency_picker c61dccdbe569c7c47527224dbab8d4fc78aecf79
          BRANCHES
          # First validate the entire inventory. Never delete a changed ref.
          while read -r branch expected; do
            test "$branch" != master
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Branch ref changed, refusing destructive cleanup: $branch"
              exit 1
            fi
          done < /tmp/retired-branches.txt
          count=0
          while read -r branch expected; do
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted: $branch"
            count=$((count+1))
          done < /tmp/retired-branches.txt
          test "$count" = 31
          echo "Deleted $count retired branches. Master preserved."
