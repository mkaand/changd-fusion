name: Servo Capture Contract POC

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/servo-fetch-visual-engine
    paths:
      - .github/workflows/servo-capture-contract-poc.yml
      - experiments/servo-capture-contract-poc/**
      - server/scripts/servo-capture-contract-poc-test.mjs
      - server/scripts/servo-benchmark-fixture.mjs
      - docs/servo-fetch-feasibility.md

permissions:
  contents: read

jobs:
  same-session-contract:
    runs-on: ubuntu-22.04
    container:
      image: debian:trixie-slim@sha256:a99cfc517144bc59b1978475ec53b46ecabec7e43635402ee5b77cc54cd1b20a
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install native Servo build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang libclang-dev curl file pkg-config \
            libegl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libglib2.0-dev libharfbuzz-dev libssl-dev
          rm -rf /var/lib/apt/lists/*
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Run isolated same-session Servo proof
        working-directory: server
        env:
          CARGO_NET_RETRY: "2"
        run: |
          runtime_dir="$(mktemp -d)"
          chmod 700 "$runtime_dir"
          test "$(stat -c %a "$runtime_dir")" = "700"
          test -O "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          trap 'rm -rf "$runtime_dir"' EXIT
          node scripts/servo-capture-contract-poc-test.mjs
