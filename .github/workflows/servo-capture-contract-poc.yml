name: Servo Capture Contract POC

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/servo-fetch-visual-engine
    paths:
      - .github/workflows/servo-capture-contract-poc.yml
      - experiments/servo-capture-contract-poc/**
      - server/scripts/servo-capture-contract-poc-test.mjs
      - server/scripts/servo-benchmark-fixture.mjs
      - docs/servo-fetch-feasibility.md

permissions:
  contents: read

jobs:
  same-session-contract:
    # servo-fetch exercises Servo directly. Its upstream E2E suite runs on a
    # GitHub-hosted Ubuntu runner; the nested job container reproduced Servo's
    # SIGSEGV after XDG runtime validation, so keep this proof on that model.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Install native Servo build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ca-certificates clang libclang-dev curl file pkg-config \
            libegl1-mesa-dev libfontconfig1-dev libfreetype-dev \
            libglib2.0-dev libharfbuzz-dev libssl-dev \
            libegl1 libegl-mesa0 libgles2 libgl1-mesa-dri \
            libfontconfig1 libfreetype6 libharfbuzz0b libx11-6 \
            libxcb1 libxcb-render0 libxcb-shape0 libxcb-xfixes0 \
            fonts-dejavu-core fonts-noto-core fonts-liberation2 \
            xauth xvfb
          rm -rf /var/lib/apt/lists/*
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Run isolated same-session Servo proof
        working-directory: server
        env:
          CARGO_NET_RETRY: "2"
        run: |
          runtime_dir="$(mktemp -d)"
          chmod 700 "$runtime_dir"
          test "$(stat -c %a "$runtime_dir")" = "700"
          test -O "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          export LIBGL_ALWAYS_SOFTWARE=1
          trap 'rm -rf "$runtime_dir"' EXIT
          xvfb-run -a --server-args='-screen 0 1280x800x24 -nolisten tcp' \
            node scripts/servo-capture-contract-poc-test.mjs
