name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pin the supported runner: ubuntu-latest changes OS/AppArmor namespace policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: server
      - name: Install sandboxed browser
        run: npx playwright install --with-deps chromium
        working-directory: server
        timeout-minutes: 5
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test
        working-directory: frontend
        timeout-minutes: 4
      - name: Backend build and unit tests
        run: npm run build && npm test
        working-directory: server
        timeout-minutes: 2
      - name: PostgreSQL and browser integration
        run: npm run test:integration
        working-directory: server
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Privacy scan (also on test failure)
        if: always()
        run: node scripts/privacy-scan.mjs
        timeout-minutes: 1
  previous-runner-diagnostic:
    # Temporary reproduction of the original runner; removed after diagnosis.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: server
        timeout-minutes: 5
      - name: Reproduce original sandbox launch with bounded cleanup
        working-directory: server
        run: |
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          let browser;
          try {
            browser = await chromium.launch({ chromiumSandbox: true, timeout: 15000 });
            console.log('Original runner sandbox launch passed');
          } catch (error) {
            console.error(error.message);
            process.exitCode = 1;
          } finally {
            await browser?.close();
          }
          JS
