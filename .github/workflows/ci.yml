name: CI
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pin the supported runner: ubuntu-latest changes OS/AppArmor namespace policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.13-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: server
      - name: Install sandboxed browser
        run: npx playwright install --with-deps chromium
        working-directory: server
        timeout-minutes: 5
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test
        working-directory: frontend
        timeout-minutes: 4
      - name: Backend build and unit tests
        run: npm run build && npm test
        working-directory: server
        timeout-minutes: 2
      - name: PostgreSQL and browser integration
        run: npm run test:integration
        working-directory: server
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
      - name: Privacy scan (also on test failure)
        if: always()
        run: node scripts/privacy-scan.mjs
        timeout-minutes: 1
      - name: Previous run sandbox diagnostics
        if: always()
        continue-on-error: true
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 38005493269 --repo "$GITHUB_REPOSITORY" --log > "$RUNNER_TEMP/previous-ci.log"
          python3 - <<'PY'
          import os
          from pathlib import Path
          log = Path(os.environ['RUNNER_TEMP'], 'previous-ci.log').read_text()
          # Emit only fixed diagnostic markers. Never republish raw logs or credentials.
          for marker in ['No usable sandbox', 'Operation not permitted', 'Failed to move to new namespace', 'AppArmor', 'Target page, context or browser has been closed', 'Running as root without --no-sandbox', 'Executable doesn\'t exist']:
              if marker in log:
                  print('::warning title=Previous CI diagnostic::' + marker)
          PY
