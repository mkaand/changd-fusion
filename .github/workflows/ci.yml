name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  APP_COMMIT: ${{ github.sha }}
  APP_BRANCH: ${{ github.head_ref || github.ref_name }}
  APP_SOURCE_PR: ${{ github.event.pull_request.number || '' }}
  APP_SOURCE_PR_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pin the supported runner: ubuntu-latest changes OS/AppArmor namespace policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: server
      - name: Install sandboxed browser
        run: npx playwright install --with-deps chromium
        working-directory: server
        timeout-minutes: 12
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test
        working-directory: frontend
        timeout-minutes: 4
      - name: Backend build and unit tests
        run: npm run build && npm test
        working-directory: server
        timeout-minutes: 2
      - name: Private Codespaces configuration and credential safeguards
        run: node --test --test-timeout=30000 scripts/preview.test.mjs
        timeout-minutes: 1
      - name: Build provenance helper safeguards
        run: node --test scripts/prepare-build-metadata.test.mjs
        timeout-minutes: 1
      - name: Private production SSH access safeguards
        run: python3 scripts/production-access.test.py
        timeout-minutes: 1
      - name: Dependency audits
        run: npm --prefix server audit --audit-level=moderate && npm --prefix frontend audit --audit-level=moderate
        timeout-minutes: 2
      - name: PostgreSQL and browser integration
        run: npm run test:integration
        working-directory: server
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
      - name: Upload synthetic documentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-screenshots
          path: |
            ${{ runner.temp }}/ui-screenshots/capture-settings-mobile.png
            ${{ runner.temp }}/ui-screenshots/history-mobile.png
          if-no-files-found: error
      - name: Privacy scan (also on test failure)
        if: always()
        run: node scripts/privacy-scan.mjs
        timeout-minutes: 1
  privacy:
    # Independent of installs, browsers and test cleanup, so failures cannot hide this scan.
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: node --test scripts/privacy-scan.test.mjs
      - run: node scripts/privacy-scan.mjs --history=origin/master
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Build production API and UI images
        run: docker build --pull --no-cache --progress=plain -t changd-fusion-api:ci ./server && docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT --build-arg APP_BRANCH --build-arg APP_SOURCE_PR -t changd-fusion-ui:ci ./frontend && docker build --pull --no-cache --progress=plain -t changd-fusion-preview:ci -f .devcontainer/Dockerfile .
        timeout-minutes: 10
      - name: Rootless resource limits and sandboxed Browser Steps smoke
        run: node scripts/docker-smoke.mjs
        timeout-minutes: 2
      - name: Nginx Docker DNS recovery
        # Admission is independently tested with PostgreSQL in Verify.
        run: node scripts/nginx-dns-smoke.mjs
        timeout-minutes: 1
      - name: Concurrent Preview and Worker resource budgets
        run: node scripts/interactive-capacity-smoke.mjs
        timeout-minutes: 2
      - name: Codespaces image sandbox smoke
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund && node scripts/preview-docker-smoke.mjs
        timeout-minutes: 2
      - name: Real Dev Container creation, HOME ownership and cross-UID resume
        run: npm install --prefix "$RUNNER_TEMP/fusion-devcontainer-cli" --no-audit --no-fund @devcontainers/cli@0.89.0 && node scripts/devcontainer-smoke.mjs
        env:
          DEVCONTAINER_CLI: ${{ runner.temp }}/fusion-devcontainer-cli/node_modules/.bin/devcontainer
        timeout-minutes: 10
  docker-arm64:
    # Native architecture validation; no privileged QEMU/binfmt setup or host policy changes.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Clean native ARM64 image builds
        run: docker build --pull --no-cache --progress=plain -t changd-fusion-api:ci ./server && docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT --build-arg APP_BRANCH --build-arg APP_SOURCE_PR -t changd-fusion-ui:ci ./frontend && docker build --pull --no-cache --progress=plain -t changd-fusion-preview:ci -f .devcontainer/Dockerfile .
        timeout-minutes: 10
      - name: ARM64 rootless resource limits and sandboxed Browser Steps smoke
        run: node scripts/docker-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 Nginx Docker DNS recovery
        run: node scripts/nginx-dns-smoke.mjs
        timeout-minutes: 1
      - name: ARM64 concurrent Preview and Worker resource budgets
        run: node scripts/interactive-capacity-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 Codespaces image sandbox smoke
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund && node scripts/preview-docker-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 real Dev Container creation, HOME ownership and cross-UID resume
        run: npm install --prefix "$RUNNER_TEMP/fusion-devcontainer-cli" --no-audit --no-fund @devcontainers/cli@0.89.0 && node scripts/devcontainer-smoke.mjs
        env:
          DEVCONTAINER_CLI: ${{ runner.temp }}/fusion-devcontainer-cli/node_modules/.bin/devcontainer
        timeout-minutes: 10
