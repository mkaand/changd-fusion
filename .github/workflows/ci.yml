name: CI
on: [push, pull_request]
permissions:
  contents: read
env:
  APP_COMMIT: ${{ github.sha }}
  APP_BRANCH: ${{ github.head_ref || github.ref_name }}
  APP_SOURCE_PR: ${{ github.event.pull_request.number || '' }}
  APP_SOURCE_PR_COMMIT: ${{ github.event.pull_request.head.sha || '' }}
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    # Pin the supported runner: ubuntu-latest changes OS/AppArmor namespace policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            frontend/package-lock.json
      - name: Install backend
        run: npm ci
        working-directory: server
      - name: Install sandboxed browser
        run: npx playwright install --with-deps chromium
        working-directory: server
        timeout-minutes: 12
      - name: Frontend build and tests
        run: npm ci && npm run build && npm test
        working-directory: frontend
        timeout-minutes: 4
      - name: Backend build and unit tests
        run: npm run build && npm test
        working-directory: server
        timeout-minutes: 2
      - name: Private Codespaces configuration and credential safeguards
        run: node --test --test-timeout=30000 scripts/preview.test.mjs
        timeout-minutes: 1
      - name: Build provenance helper safeguards
        run: node --test scripts/prepare-build-metadata.test.mjs
        timeout-minutes: 1
      - name: Private production SSH access safeguards
        run: python3 scripts/production-access.test.py
        timeout-minutes: 1
      - name: Dependency audits
        run: npm --prefix server audit --audit-level=moderate && npm --prefix frontend audit --audit-level=moderate
        timeout-minutes: 2
      - name: PostgreSQL and browser integration
        run: npm run test:integration
        working-directory: server
        timeout-minutes: 10
        env:
          TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/postgres
          UI_SCREENSHOT_DIR: ${{ runner.temp }}/ui-screenshots
      - name: Upload synthetic documentation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-ui-screenshots
          path: |
            ${{ runner.temp }}/ui-screenshots/capture-settings-mobile.png
            ${{ runner.temp }}/ui-screenshots/history-mobile.png
          if-no-files-found: error
      - name: Privacy scan (also on test failure)
        if: always()
        run: node scripts/privacy-scan.mjs
        timeout-minutes: 1
  attestation:
    name: attestation
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install checksum-pinned official GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          version=2.103.3
          archive="gh_${version}_linux_amd64.tar.gz"
          install_dir="${RUNNER_TEMP}/gh-attestation"
          mkdir -p "$install_dir"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$install_dir/$archive" \
            "https://github.com/cli/cli/releases/download/v${version}/${archive}"
          printf '%s  %s\n' \
            '4c806978ffce1cec70853302a56d70ac6da4f19bae7adca4e1a8ab00633dd91d' \
            "$archive" > "$install_dir/archive.sha256"
          (cd "$install_dir" && sha256sum --check archive.sha256)
          tar -xzf "$install_dir/$archive" -C "$install_dir"
          echo "GH_ATTESTATION_BIN=$install_dir/gh_${version}_linux_amd64/bin/gh" >> "$GITHUB_ENV"
      - name: Download immutable official signed test evidence
        shell: bash
        run: |
          set -euo pipefail
          fixture_dir="${RUNNER_TEMP}/sigstore-fixtures"
          fixture_commit=63837fb778d6a39f02be0ce76ff89f2bc8d74bdc
          fixture_base="https://raw.githubusercontent.com/cli/cli/${fixture_commit}/pkg/cmd/attestation/test/data"
          mkdir -p "$fixture_dir"
          for name in sigstore-js-2.1.0.tgz sigstore-js-2.1.0-bundle.json trusted_root.json sigstoreBundle-invalid-signature.json; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              --output "$fixture_dir/$name" "$fixture_base/$name"
          done
          printf '%s\n' \
            'f0c641fce0310cb43208f4272dc1423153630e44ba8cdc0b5ce8466f724e0eed  sigstore-js-2.1.0.tgz' \
            'cfadddd579b9fb45947530cd0e860986ec610a28f7fa6de3ef31cc051f07f761  sigstore-js-2.1.0-bundle.json' \
            '455b3fe53e2678889f093d66ebbfda5f12ebb9d682b146c3535fa04e97689787  trusted_root.json' \
            '4c8dae9fb3c3e0406fed7792da1b378689cc236e5c120fd05ff3de2cb15f4b7c  sigstoreBundle-invalid-signature.json' \
            > "$fixture_dir/fixtures.sha256"
          (cd "$fixture_dir" && sha256sum --check fixtures.sha256)
          echo "SIGSTORE_TEST_ARTIFACT=$fixture_dir/sigstore-js-2.1.0.tgz" >> "$GITHUB_ENV"
          echo "SIGSTORE_TEST_BUNDLE=$fixture_dir/sigstore-js-2.1.0-bundle.json" >> "$GITHUB_ENV"
          echo "SIGSTORE_TEST_INVALID_BUNDLE=$fixture_dir/sigstoreBundle-invalid-signature.json" >> "$GITHUB_ENV"
          echo "SIGSTORE_TEST_TRUST_ROOT=$fixture_dir/trusted_root.json" >> "$GITHUB_ENV"
      - name: Verify real Sigstore signatures and fail-closed policy
        run: node --test scripts/sigstore-live.test.mjs
  privacy:
    # Independent of installs, browsers and test cleanup, so failures cannot hide this scan.
    runs-on: ubuntu-22.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - run: node --test scripts/privacy-scan.test.mjs
      - run: node scripts/privacy-scan.mjs --history=origin/master
  docker:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Build production API and UI images
        run: docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT -t changd-fusion-api:ci ./server && docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT --build-arg APP_BRANCH --build-arg APP_SOURCE_PR -t changd-fusion-ui:ci ./frontend && docker build --pull --no-cache --progress=plain -t changd-fusion-preview:ci -f .devcontainer/Dockerfile .
        timeout-minutes: 10
      - name: Rootless resource limits and sandboxed Browser Steps smoke
        run: node scripts/docker-smoke.mjs
        timeout-minutes: 2
      - name: Nginx Docker DNS recovery
        # Admission is independently tested with PostgreSQL in Verify.
        run: node scripts/nginx-dns-smoke.mjs
        timeout-minutes: 1
      - name: Sequential Preview and Worker resource budgets
        run: node scripts/interactive-capacity-smoke.mjs
        timeout-minutes: 2
      - name: Codespaces image sandbox smoke
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund && node scripts/preview-docker-smoke.mjs
        timeout-minutes: 2
      - name: Chromium crash fencing and operator-assisted recovery
        run: npm run build --prefix server && node scripts/chromium-crash-smoke.mjs
        timeout-minutes: 5
      - name: Real Dev Container creation, HOME ownership and cross-UID resume
        run: npm install --prefix "$RUNNER_TEMP/fusion-devcontainer-cli" --no-audit --no-fund @devcontainers/cli@0.89.0 && node scripts/devcontainer-smoke.mjs
        env:
          DEVCONTAINER_CLI: ${{ runner.temp }}/fusion-devcontainer-cli/node_modules/.bin/devcontainer
        timeout-minutes: 10
  docker-arm64:
    # Native architecture validation; no privileged QEMU/binfmt setup or host policy changes.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - name: Clean native ARM64 image builds
        run: docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT -t changd-fusion-api:ci ./server && docker build --pull --no-cache --progress=plain --build-arg APP_COMMIT --build-arg APP_BRANCH --build-arg APP_SOURCE_PR -t changd-fusion-ui:ci ./frontend && docker build --pull --no-cache --progress=plain -t changd-fusion-preview:ci -f .devcontainer/Dockerfile .
        timeout-minutes: 10
      - name: ARM64 rootless resource limits and sandboxed Browser Steps smoke
        run: node scripts/docker-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 Nginx Docker DNS recovery
        run: node scripts/nginx-dns-smoke.mjs
        timeout-minutes: 1
      - name: ARM64 sequential Preview and Worker resource budgets
        run: node scripts/interactive-capacity-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 Codespaces image sandbox smoke
        run: npm ci --prefix server --ignore-scripts --no-audit --no-fund && node scripts/preview-docker-smoke.mjs
        timeout-minutes: 2
      - name: ARM64 Chromium crash fencing and operator-assisted recovery
        run: npm run build --prefix server && node scripts/chromium-crash-smoke.mjs
        timeout-minutes: 5
      - name: ARM64 real Dev Container creation, HOME ownership and cross-UID resume
        run: npm install --prefix "$RUNNER_TEMP/fusion-devcontainer-cli" --no-audit --no-fund @devcontainers/cli@0.89.0 && node scripts/devcontainer-smoke.mjs
        env:
          DEVCONTAINER_CLI: ${{ runner.temp }}/fusion-devcontainer-cli/node_modules/.bin/devcontainer
        timeout-minutes: 10
