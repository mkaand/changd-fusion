name: GHCR updater release

on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Authorized 40-character master commit SHA to publish"
        required: true
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: ghcr-updater-release-master
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.repository.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
      packages: write
      id-token: write
      attestations: write
    env:
      SOURCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.source_sha }}
      UPDATER_IMAGE: ghcr.io/mkaand/changd-fusion-updater
    steps:
      - name: Validate authorized source SHA
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Check out trusted master history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: master
          fetch-depth: 0

      - name: Verify source and exact CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/master
          echo "SOURCE_TREE=$(git rev-parse ${SOURCE_SHA}^{tree})" >> "$GITHUB_ENV"
          runs_headers="$(mktemp)"
          runs_json="$(mktemp)"
          curl --fail-with-body --silent --show-error --dump-header "$runs_headers" --output "$runs_json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${SOURCE_SHA}&per_page=100"
          ! grep -qi '^link:.*rel="next"' "$runs_headers" || exit 1
          run_id="$(node scripts/ghcr-ci-gate.mjs select "$runs_json" - "$SOURCE_SHA")"
          jobs_headers="$(mktemp)"
          jobs_json="$(mktemp)"
          curl --fail-with-body --silent --show-error --dump-header "$jobs_headers" --output "$jobs_json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?filter=latest&per_page=100"
          ! grep -qi '^link:.*rel="next"' "$jobs_headers" || exit 1
          node scripts/ghcr-ci-gate.mjs verify "$runs_json" "$jobs_json" "$SOURCE_SHA"

      - name: Check out the authorized source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Resolve updater version
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./updater/package.json').version")"
          [[ "$version" == "$(node -p "require('./server/package.json').version")" ]]
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish updater image
        id: updater
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: updater/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            APP_COMMIT=${{ env.SOURCE_SHA }}
            APP_VERSION=${{ env.APP_VERSION }}
          tags: ${{ env.UPDATER_IMAGE }}:${{ env.APP_VERSION }}-${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          provenance: mode=max

      - name: Attest updater image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ${{ env.UPDATER_IMAGE }}
          subject-digest: ${{ steps.updater.outputs.digest }}
          push-to-registry: true

      - name: Write immutable updater manifest
        shell: bash
        env:
          UPDATER_DIGEST: ${{ steps.updater.outputs.digest }}
        run: |
          set -euo pipefail
          jq -n \
            --arg source_sha "$SOURCE_SHA" \
            --arg source_tree "$SOURCE_TREE" \
            --arg version "$APP_VERSION" \
            --arg updater_image "${UPDATER_IMAGE}@${UPDATER_DIGEST}" \
            --arg architecture "linux/amd64" \
            --arg workflow_run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{source_sha:$source_sha,source_tree:$source_tree,version:$version,updater_image:$updater_image,architecture:$architecture,workflow_run:$workflow_run,created_at:$created_at}' \
            > updater-release-manifest.json
          cat updater-release-manifest.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload updater release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ghcr-updater-manifest-${{ env.SOURCE_SHA }}
          path: updater-release-manifest.json
          if-no-files-found: error
