[package]
name = "servo-capture-contract-poc"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2.177"
serde_json = "1.0.145"
servo-fetch = "=0.15.1"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
# Keep the pre-release crypto dependency graph aligned with upstream 0.15.1's
# Cargo.lock. Without these exact versions, a fresh registry solve can select
# incompatible release-candidate APIs.
pkcs1 = "=0.8.0-rc.4"
pkcs8 = "=0.11.0"
