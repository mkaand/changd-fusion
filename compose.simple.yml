# Opt-in preview; production Compose remains untouched.
name: changd-fusion-simple
services:
  fusion:
    build:
      context: .
      dockerfile: simple/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - seccomp=./docker/chromium-seccomp.json
    environment:
      PORT: 3000
      FUSION_DATA_DIR: /data
      PUBLIC_URL: ${FUSION_SIMPLE_PUBLIC_URL:-http://localhost:8127}
      PLAYWRIGHT_EXECUTABLE_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:${FUSION_SIMPLE_PORT:-8127}:3000"
    volumes:
      - simple-data:/data
    shm_size: 256mb
    pids_limit: 256
    mem_limit: 1600m
volumes:
  simple-data:
