name: changd-fusion
x-app: &app
  build: ./server
  image: changd-fusion-api:development
  init: true
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET}
    CHANNEL_KEY: ${CHANNEL_KEY:?Generate CHANNEL_KEY}
    PUBLIC_URL: ${PUBLIC_URL:-https://example.com}
    REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
    HISTORY_DAYS: ${HISTORY_DAYS:-90}
    DATA_DIR: /data
    CAPTURE_TIMEOUT_MS: ${CAPTURE_TIMEOUT_MS:-30000}
    CAPTURE_ENGINE: ${CAPTURE_ENGINE:-chromium}
    CHROMIUM_CONCURRENCY: ${CHROMIUM_CONCURRENCY:-1}
    MAX_CAPTURE_WIDTH: ${MAX_CAPTURE_WIDTH:-4096}
    MAX_CAPTURE_HEIGHT: ${MAX_CAPTURE_HEIGHT:-8192}
    MAX_CAPTURE_PIXELS: ${MAX_CAPTURE_PIXELS:-8000000}
  volumes:
    - captures:/data
  networks: [fusion]
services:
  db:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [fusion]
  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    depends_on:
      db: { condition: service_healthy }
  api:
    <<: *app
    command: ["node", "dist/index.js"]
    # Region previews launch the same rootless sandboxed Chromium as the worker.
    # Keep this service scoped to Changd Fusion's checked-in syscall profile.
    security_opt: ["seccomp=./docker/chromium-seccomp.json"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  worker:
    <<: *app
    command: ["node", "dist/worker-main.js"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    # Chromium runs as a non-root user with its sandbox enabled. Never use --no-sandbox.
    # Runtime must allow unprivileged user namespaces; see docs/security.md.
    security_opt: ["seccomp=./docker/chromium-seccomp.json"]
    cpus: ${WORKER_CPUS:-1.0}
    mem_limit: ${WORKER_MEMORY:-1g}
    pids_limit: ${WORKER_PIDS:-256}
    shm_size: ${WORKER_SHM:-256mb}
    restart: unless-stopped
    stop_grace_period: ${WORKER_STOP_GRACE:-180s}
  ui:
    build: ./frontend
    ports: ["127.0.0.1:3000:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    networks: [fusion]
volumes:
  database:
  captures:
networks:
  fusion:
